<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <h1><f:translate key="LLL:EXT:flight_ops/Resources/Private/Language/locallang.xlf:board.title" /></h1>

    <f:if condition="{departures}">
        <f:then>
            <table class="flight-board">
                <f:for each="{departures}" as="departure">
                    <tr class="flight-board__row">
                        <td class="flight-number">{departure.flight_number}</td>
                        <td class="destination">{departure.destination}</td>
                        <td class="seats">{departure.seats}</td>
                    </tr>
                </f:for>
            </table>
        </f:then>
        <f:else>
            <p class="flight-board__empty">
                <f:translate key="LLL:EXT:flight_ops/Resources/Private/Language/locallang.xlf:board.empty" />
            </p>
        </f:else>
    </f:if>
</f:section>

</html>
