<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <h1>{f:translate(key: 'LLL:EXT:flight_ops/Resources/Private/Language/locallang.xlf:board.title')}</h1>

    <f:if condition="{departures}">
        <f:then>
            <table class="flight-board">
                <f:for each="{departures}" as="departure">
                    <tr>
                        <td>{departure.flightNumber}</td>
                        <td>{departure.destination}</td>
                        <td><f:format.date format="H:i">{departure.scheduled}</f:format.date></td>
                        <td>{departure.remark -> f:format.html()}</td>
                    </tr>
                </f:for>
            </table>
        </f:then>
        <f:else>
            <p><f:translate key="board.empty" extensionName="FlightOps" /></p>
        </f:else>
    </f:if>

    <f:link.action action="detail" arguments="{gate: gates}" absolute="1">
        <f:translate key="board.details" />
    </f:link.action>
</f:section>

</html>
